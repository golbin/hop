name: HOP CI

on:
  pull_request:
  push:
    branches:
      - main
      - fix/conference-template-layout
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hop-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NODE_VERSION: "24"

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0

      - name: Fetch the official base tag for downstream verification
        shell: bash
        run: |
          if node -e "process.exit(require('./config/rhwp-upstream.json').fork ? 0 : 1)"; then
            source="$(node -p "require('./config/rhwp-upstream.json').source")"
            tag="$(node -p "require('./config/rhwp-upstream.json').tag")"
            git -C third_party/rhwp fetch --no-tags "$source" "refs/tags/$tag:refs/tags/$tag"
          fi

      - name: Install Linux dependencies
        shell: bash
        run: |
          set -euo pipefail

          fuse_package="libfuse2"
          if apt-cache show libfuse2t64 >/dev/null 2>&1; then
            fuse_package="libfuse2t64"
          fi

          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            "$fuse_package" \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: unit-tests-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            unit-tests-pnpm-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Pin Rust to upstream contract
        shell: bash
        run: |
          toolchain="$(node -p "require('./config/rhwp-upstream.json').rustToolchain")"
          rustup toolchain install "$toolchain" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: unit-tests-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            unit-tests-cargo-

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify rhwp upstream contract
        run: pnpm upstream:verify

      - name: Typecheck and build studio
        run: pnpm build:studio

      - name: Run unit tests
        run: pnpm test

      - name: Lint desktop Rust
        run: pnpm clippy:desktop
