[package]
name = "hop-desktop"
version = "0.2.0"
edition = "2021"
description = "HOP - Open HWP desktop app"
license = "MIT"

[lib]
name = "hop_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "hop-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rhwp = { path = "../../../third_party/rhwp" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2.5"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
open = "5"
svg2pdf = "0.13"
usvg = "0.45"
pdf-writer = "0.12"
mcp-sdk-rs = "0.3"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
llama-cpp-2 = "0.1.146"
async-trait = "0.1"
anyhow = "1"
notify = "6.1"
calamine = "0.24"
lopdf = "0.33"
window-vibrancy = "0.5"
num_cpus = "1.16"
reqwest = { version = "0.12", features = ["json"] }
regex = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSDocumentController"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSURL"] }
